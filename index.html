<div id="viewport" aria-label="몽글랜드 3D 놀이터"></div><div class="shade"></div>
<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">✦</span><div><strong>몽글랜드</strong><small>INDOOR PLAY CLUB</small></div></div>
  <nav class="nav" aria-label="놀이터 메뉴">
    <button class="pill" id="animals"><span data-icon="animal"></span>동물</button>
    <button class="pill" id="mapBtn"><span data-icon="map"></span>지도</button>
    <span class="live" id="presence" data-mode="pending" aria-live="polite">함께 놀기</span>
    <button class="pill icon-only" id="help" aria-label="조작법" title="조작법"><span data-icon="help"></span></button>
  </nav>
</header>
<section id="welcome" class="welcome">
  <div class="caps">3D INDOOR PLAYGROUND</div>
  <h1>몽글랜드에<br>어서 와!</h1>
  <p>커다란 실내 놀이터에서 마음껏 놀아요.</p>
  <button class="enter" id="start">놀이터 들어가기 <span aria-hidden="true">→</span></button>
  <p class="hint" id="entryHint">WASD 또는 방향키로 움직여요</p>
  <span class="selected-animal" id="animalNote"></span>
</section>
<div id="hud" class="hud" hidden>
  <div class="keyhint" aria-label="키보드 조작"><span><kbd>WASD</kbd>이동</span><span><kbd>SPACE</kbd>점프</span><span><kbd>E</kbd>타기</span></div>
  <div class="mobile-controls"><div class="stick" id="stick" aria-label="이동 조이스틱"><i></i></div></div>
  <div class="location"><span class="caps" id="locationNum">FLOOR 01</span><b id="location">입구 광장</b></div>
  <div class="mobile-controls"><button class="jump" id="jumpBtn" aria-label="점프">↑</button></div>
</div>
<button id="rideBtn" class="prompt" hidden><kbd>E</kbd><span></span></button>
<div id="playActions" class="play-actions" hidden>
  <button class="pill" id="gestures">✨ 동작</button>
  <button class="pill" id="voiceLines">🔊 대사</button>
</div>
<div id="extras" class="extras" aria-label="주변 물건 조작" hidden>
  <button class="pill" id="putBlock" hidden>내려놓기</button>
  <button class="pill primary" id="stackBlock" hidden>쌓기</button>
  <button class="pill primary" id="throwBall" hidden>공 던지기</button>
  <button class="pill primary" id="kickBall" hidden>뻥 차기</button>
  <button class="pill" id="pickMusic" hidden>♫ 음악 고르기</button>
</div>
<input id="musicFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg" hidden>
<div id="flight" class="flight" hidden><b>✦ 별빛 우주를 날아요<small>잠시 후 몽글랜드에 도착해요</small></b></div>
<div id="social" class="social" hidden>
  <span class="nearby" id="nearby"></span>
  <button class="pill" id="waveBtn">👋 인사</button>
  <button class="pill primary" id="danceBtn">♫ 같이 춤추기</button>
</div>
<div id="socialStatus" class="social-status" role="status" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialogTitle">
  <div class="dialog-top"><div><div class="caps" id="dialogTag"></div><h2 id="dialogTitle"></h2></div><form method="dialog"><button class="pill icon-only" data-icon="close" aria-label="닫기"></button></form></div>
  <div id="dialogBody" class="dialog-body"></div>
</dialog>
<div id="fatal" class="fatal" hidden><div><h2>3D 화면을 열 수 없어요</h2><p>WebGL 2를 지원하는 최신 Chrome이나 Edge에서 파일을 열고 브라우저의 그래픽 가속 설정을 확인해 주세요.</p></div></div>
<noscript>3D 놀이터를 열려면 브라우저에서 JavaScript를 켜 주세요.</noscript>

      if(node.isMesh && !node.isInstancedMesh && !node.material.transparent){
        const id=[node.geometry.id,node.material.id,node.castShadow,node.receiveShadow].join("/");
        if(!batches.has(id))batches.set(id,[]);
        batches.get(id).push(node);

      for(const child of node.children)visit(child);
    }
    visit(world);
    for(const list of batches.values()){
      if(list.length<3)continue;
      const first=list[0],batch=new THREE.InstancedMesh(first.geometry,first.material,list.length);
      batch.castShadow=first.castShadow;batch.receiveShadow=first.receiveShadow;
      list.forEach((object,i)=>{batch.setMatrixAt(i,object.matrixWorld);object.removeFromParent();});

    character.feet[1].rotation.x=sitting?-1.03:-step;
    character.arms[0].rotation.x=-step*.7;
    character.arms[1].rotation.x=step*.7;
    character.arms[0].rotation.z=party?-.9-.51*cos(beat):0;
    character.arms[1].rotation.z=party?.9-.51*cos(beat):waving?2.0+.26*sin(clock()/78):0;
    character.wave.visible=waving&&!party;
    if(!party)poseExtras(character,pose,sitting);
    else character.pivot.position.z=0;
    character.shadow.position.set(pose.x,floorAt(pose.x,pose.z,pose.y)+.022,pose.z);
    const scale=clamp(1-pose.y*.065,.58,1);
    character.shadow.scale.setScalar(scale);

  function physics(dt) {
    if(dancePhase(self.dance_at)>=0){state.moving=false;return;}
    if(flightAge!==null){fly(dt);return;}
    if(swingAge!==null){swingStep(dt);return;}
    if(move && moveStep(dt))return;
    const ride=state.ride;
    if(ride){
      ride.t=Math.min(ride.t+dt/ride.duration,1);
      const t=ride.t**1.16;
      const p=ride.curve.getPointAt(t),d=ride.curve.getTangentAt(t);
      state.bodyYaw=turn(state.bodyYaw,Math.atan2(-d.x,-d.z),Math.min(1,dt*10));
      state.x=p.x;state.y=p.y+.06;state.z=p.z;
      if(ride.t===1){state.ride=null;state.velocityY=0;state.grounded=false;}
      return;
    }
    const forward=Number(held("w","arrowup"))-Number(held("s","arrowdown"))-joystick.y;
    const strafe=Number(held("d","arrowright"))-Number(held("a","arrowleft"))+joystick.x;
    const norm=Math.max(1,hypot(strafe,forward)),speed=held("shift")?7.4:5.3;
    const sx=(cos(cameraYaw)*strafe-sin(cameraYaw)*forward)/norm;
    const sz=(-sin(cameraYaw)*strafe-cos(cameraYaw)*forward)/norm;
    if(driving){drive(dt,sx,sz);return;}
    if(state.grounded||hypot(sx,sz)>.02)air.set(sx*speed,0,sz*speed);
    else air.multiplyScalar(Math.exp(-dt*.58));
    const dx=air.x*dt,dz=air.z*dt;
    state.moving=hypot(dx,dz)>.003;
    if(state.moving && state.sitting){state.sitting=false;state.z+=.63;state.y=0;}
    if(state.sitting)return;
    if(state.moving){
      const pace=inPit(state.x,state.z)?.69:1;
      if(walkable(state.x+dx*pace,state.z,state.y))state.x+=dx*pace;
      if(walkable(state.x,state.z+dz*pace,state.y))state.z+=dz*pace;
      state.bodyYaw=turn(state.bodyYaw,Math.atan2(-dx,-dz),Math.min(1,dt*13));
      pushSoccer(dx,dz);
    }
    const floor=floorAt(state.x,state.z,state.y);
    state.velocityY-=16*dt;
    state.y+=state.velocityY*dt;
    if(state.y<=floor){state.y=floor;state.velocityY=0;state.grounded=true;}
    else state.grounded=false;
  }
  function updateCamera(dt,snap=false) {
    if(!state.playing){
      const portrait=camera.aspect<.80;

      camera.lookAt(portrait?-.9:.55,2.65,-9);
      return;
    }
    const distance=driving?9.0:8.1;
    cameraGoal.set(clamp(state.x+sin(cameraYaw)*distance,-28.5,28.5),
      6.25+cameraPitch*7+(flightAge!==null?state.y*.32:0),
      clamp(state.z+cos(cameraYaw)*distance,-35.4,35.1));
    camera.position.lerp(cameraGoal,snap?1:1-Math.exp(-dt*6.6));
    camTarget.set(state.x,2.7+(flightAge!==null?state.y*.32:0),state.z);
    camera.lookAt(camTarget);
  }

  function buildCar() {

    const steering=torus(0,1.03,-.50,.21,.043,0x51476b,model);
    steering.rotation.x=.54;
    for(const x of [-.77,.77]){
      oval(x*.77,.63,-1.20,.145,.1,.05,0xfff1c1,model,false);
      oval(x*.77,.62,1.18,.12,.085,.04,0xfa7e8f,model,false);
      for(const z of [-.71,.71]){
        cylinder(x,.33,z,.27,.22,0x4a435e,model,.27,16).rotation.z=PI/2;

  function carClear(x,z) {
    return walkable(x,z,0) && !inPit(x,z) && !trNear(x,z) &&
      !solids.some(b=>Math.abs(b.x-x)<b.w+.75 && Math.abs(b.z-z)<b.d+.85);
  }
  function stopCar() {
    if(!driving)return;
    driving=false;driveSpeed.set(0,0,0);
    playerCarPose.set(state.x,0,state.z);parkedYaw=state.bodyYaw;
    const right=V(cos(state.bodyYaw),0,-sin(state.bodyYaw)).multiplyScalar(1.33);
    if(walkable(state.x+right.x,state.z+right.z,0)){state.x+=right.x;state.z+=right.z;}
    state.y=0;state.grounded=true;scheduleRoom(0);
  }
  function enterCar() {
    if(driving){stopCar();return;}
    if(heldBlock)putBlock(false);
    move=null;state.sitting=false;driving=true;state.grounded=true;
    Object.assign(state,{x:playerCarPose.x,z:playerCarPose.z,y:.54,bodyYaw:parkedYaw,velocityY:0});
    scheduleRoom(0);
  }
  function drive(dt,x,z) {
    const rate=1-Math.exp(-dt*5.7);
    driveSpeed.x=mix(driveSpeed.x,x*12.5,rate);
    driveSpeed.z=mix(driveSpeed.z,z*12.5,rate);
    const dx=driveSpeed.x*dt,dz=driveSpeed.z*dt;
    if(carClear(state.x+dx,state.z))state.x+=dx;else driveSpeed.x=0;
    if(carClear(state.x,state.z+dz))state.z+=dz;else driveSpeed.z=0;
    state.moving=driveSpeed.lengthSq()>.12;
    if(state.moving)state.bodyYaw=turn(state.bodyYaw,Math.atan2(-dx,-dz),Math.min(1,dt*9));
    state.y=.54;
    pushSoccer(dx,dz,1.55);
  }

      }
      const data=await response.json();
      if(!Array.isArray(data.players)||!Number.isFinite(data.now))throw Error("invalid");
      readRoom(data);
      failures=0;connected=true;
      if(action?.action==="dance" && clock()-self.dance_at>6600)toast("춤을 출 친구에게 조금 더 다가가 보세요.");
    } catch(error){
      failures++;
      if(failures>=2 || !connected){
        connected=false;self=emptyPose;
        for(const [id,peer] of peers)forgetPeer(id,peer);
        if(error.message!=="409")showPresence("offline","혼자 노는 중");
      }
      if(action)toast("친구와의 연결을 다시 확인하고 있어요.");
    } finally {
      polling=false;
      const urgent=queued||Boolean(nextAction);
      queued=false;
      scheduleRoom(urgent?0:failures?Math.min(8000,1000*2**failures):state.moving||self.dance_at>clock()-6600?340:650);
    }
  }
  function nearbyPeer() {
    if(!connected||!state.grounded||pause()||state.ride||state.sitting||driving)return null;
    let closest=null, distance=4.25;
    for(const peer of peers.values()){
      const p=peer.data, d=hypot(state.x-p.x,state.z-p.z);
      if(d<distance && Math.abs(state.y-p.y)<=1.75){closest=peer;distance=d;}
    }
    return closest;
  }
  function socialAction(action) {
    const peer=nearbyPeer();
    if(!peer || nextAction || clock()-self.dance_at<6500)return;
    nextAction={action,target:peer.data.id};
    scheduleRoom(0);
  }
  function updatePeople(dt) {
    for(const peer of peers.values()){
      const {model,pose,data}=peer;
      const t=Math.min(1,dt*8);
      const snap=hypot(pose.x-data.x,pose.z-data.z)>6;
      pose.x=mix(pose.x,data.x,snap?1:t);pose.y=mix(pose.y,data.y,snap?1:t);pose.z=mix(pose.z,data.z,snap?1:t);
      pose.bodyYaw=turn(pose.bodyYaw,data.yaw,t);
      model.root.visible=model.shadow.visible=hypot(state.x-pose.x,state.z-pose.z)<36;
      const sitting=applyPeerPlay(peer);
      if(model.root.visible)animateAvatar(model,pose,dt,data.motion===1,sitting,dancePhase(data.dance_at),isWaving(data.wave_at));
    }
    const partner=nearbyPeer(),danceAge=clock()-self.dance_at;
    const party=danceAge<6500;
    social.hidden=!partner||party;
    socialStatus.hidden=!party;
    if(party){
      const text=danceAge<0?"♪ 같이 춤출 준비!":"♫ 같이 춤추는 중!";
      if(socialStatus.textContent!==text)socialStatus.textContent=text;
    }
    if(partner){
      const text=animals[partner.data.animal].name+" 친구";
      if($("nearby").textContent!==text)$("nearby").textContent=text;
      $("danceBtn").disabled=partner.data.motion===2 || clock()-partner.data.dance_at<6500;
    }
    social.classList.toggle("no-ride",$("rideBtn").hidden);
  }
  $("waveBtn").onclick=()=>socialAction("wave");
  $("danceBtn").onclick=()=>socialAction("dance");
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)scheduleRoom(0);});
  window.addEventListener("pagehide",()=>{
    if(state.playing && connected)navigator.sendBeacon(roomEndpoint,JSON.stringify(roomData({action:"leave"})));
  });
  requestAnimationFrame(frame);
}

</script>
